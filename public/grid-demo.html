<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timetable Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .timetable-wrapper {
      border: 1px solid #ccc;
      height: 70vh;
      overflow: auto;
    }

    .timetable {
      display: grid;
      grid-template-columns: 180px repeat(10, 1fr);
      grid-auto-rows: 60px;
      min-width: 1000px;
    }

    .cell {
      border: 1px solid #e0e0e0;
      padding: 6px;
      box-sizing: border-box;
      background: #fff;
    }

    /* Top header row */
    .header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #f5f5f5;
      font-weight: 600;
      text-align: center;
    }

    /* Left header column */
    .row-header {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #f9f9f9;
      font-weight: 600;
    }

    /* Top-left corner */
    .corner {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
      background: #eaeaea;
    }

    select {
      width: 100%;
    }
  </style>
</head>
<body>

<h1>School Timetable (Demo)</h1>

<div class="timetable-wrapper">
  <div class="timetable" id="timetable"></div>
</div>

<script>
  const days = [
    "Mon 9",
    "Mon 10",
    "Mon 11",
    "Tue 9",
    "Tue 10",
    "Tue 11",
    "Wed 9",
    "Wed 10",
    "Thu 9",
    "Fri 9"
  ];

  const classes = [
    "Class 1A",
    "Class 1B",
    "Class 2A",
    "Class 2B",
    "Class 3A",
    "Class 3B",
    "Class 4A",
    "Class 5A"
  ];

  const subjects = [
    "",
    "Maths",
    "English",
    "Science",
    "History",
    "PE",
    "Art"
  ];

  const grid = document.getElementById("timetable");

  // Top-left corner
  grid.appendChild(makeCell("", "cell header corner"));

  // Header row
  days.forEach(day => {
    grid.appendChild(makeCell(day, "cell header"));
  });

  // Rows
  classes.forEach(className => {
    grid.appendChild(makeCell(className, "cell row-header"));

    days.forEach(() => {
      const cell = document.createElement("div");
      cell.className = "cell";

      const select = document.createElement("select");
      subjects.forEach(subject => {
        const option = document.createElement("option");
        option.value = subject;
        option.textContent = subject || "—";
        select.appendChild(option);
      });

      cell.appendChild(select);
      grid.appendChild(cell);
    });
  });

  function makeCell(text, className) {
    const div = document.createElement("div");
    div.className = className;
    div.textContent = text;
    return div;
  }
</script>

</body>
</html>
